  :root{
    --paper:#F5F3ED; --card:#FCFBF7; --ink:#1C1C1A;
    --ai:#22405F; --ai-soft:#63748A; --seal:#B23B2E;
    --line:#E3DFD4; --line-strong:#D6D1C4;
    --jp-serif:'JPSerif',serif; --jp-sans:'JPSans',sans-serif;
    --base:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--base);
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;}
  .app{width:100%;max-width:560px;min-height:100dvh;display:flex;flex-direction:column;
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));}
  .jp{font-family:var(--jp-sans)}
  .kanji{font-family:var(--jp-serif)}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand .t{font-weight:700;font-size:15px;letter-spacing:.2px}
  .brand .s{font-size:12px;color:var(--ai-soft)}
  .lesson{position:relative}
  .lesson select{appearance:none;-webkit-appearance:none;font-family:inherit;font-weight:600;font-size:14px;
    color:var(--ai);background:transparent;border:1px solid var(--line-strong);border-radius:999px;
    padding:8px 34px 8px 16px;cursor:pointer;max-width:150px;}
  .lesson::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;
    border-right:2px solid var(--ai);border-bottom:2px solid var(--ai);
    transform:translateY(-70%) rotate(45deg);pointer-events:none;}
  .meta{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
  .count{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--ai-soft)}
  .count b{color:var(--ink)}
  .track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar{height:100%;width:0;background:var(--ai);transition:width .3s ease}
  .stage{flex:1;display:flex;align-items:center;perspective:1400px;padding:14px 0}
  .card{width:100%;height:60vh;min-height:360px;max-height:540px;position:relative;cursor:pointer;
    transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1);}
  .card.flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 1px 0 #fff inset,0 18px 40px -28px rgba(28,40,60,.55);display:flex;flex-direction:column;}
  .front{align-items:center;justify-content:center;text-align:center}
  .front .word{font-size:clamp(56px,18vw,116px);font-weight:600;line-height:1.04;color:var(--ink);padding:0 16px}
  .front .hint{position:absolute;bottom:22px;left:0;right:0;font-size:12.5px;color:var(--ai-soft)}
  .corner{position:absolute;top:16px;left:18px;font-size:12px;font-weight:600;color:var(--line-strong)}
  .back{transform:rotateY(180deg);padding:26px 24px;overflow-y:auto;gap:2px}
  .back .word{font-size:clamp(34px,10vw,56px);font-weight:600;line-height:1.05;color:var(--ink)}
  .back .kana{font-size:17px;color:var(--ai);margin-top:6px;font-weight:500}
  .seal{align-self:flex-start;margin-top:14px;font-weight:600;font-size:14px;letter-spacing:.4px;
    color:var(--seal);border:1.5px solid var(--seal);border-radius:6px;padding:3px 10px;}
  .mean{font-size:19px;font-weight:600;margin-top:16px;line-height:1.4}
  .rule{height:1px;background:var(--line);margin:18px 0 16px}
  .ex + .ex{margin-top:16px}
  .ex .j{font-size:16px;line-height:1.7;color:var(--ink)}
  .ex .v{font-size:14px;line-height:1.55;color:var(--ai-soft);margin-top:5px}

ội lỗi."]]}]}, "45": {"name": "Bài 45", "cards": [{"k": "厳重", "r": "げんじゅう", "h": "Nghiêm Trọng", "m": "Nghiêm ngặt, chặt chẽ", "ex": [["安全のために空港では厳重な検査を行っている。", "Vì an toàn, sân bay đang tiến hành kiểm tra nghiêm ngặt."]]}, {"k": "育児", "r": "いくじ", "h": "Dục Nhi", "m": "Chăm con, nuôi con", "ex": [["彼女は来月から育児休暇を取るつもりだ。", "Cô ấy dự định xin nghỉ chăm con từ tháng sau."]]}, {"k": "援助", "r": "えんじょ", "h": "Viện Trợ", "m": "Hỗ trợ, viện trợ", "ex": [["彼女は、国からの援助を受けて学校に通っている。", "Cô ấy nhận hỗ trợ từ nhà nước và đang đến trường."]]}, {"k": "演説", "r": "えんぜつ", "h": "Diễn Thuyết", "m": "Diễn thuyết", "ex": [["10時から市長の演説が行われる。", "Buổi diễn thuyết của thị trưởng sẽ diễn ra từ 10 giờ."]]}, {"k": "該当", "r": "がいとう", "h": "Cai Đương", "m": "Tương ứng, thuộc diện (điều kiện)", "ex": [["輸入禁止品目に該当するものは国内に持ち込めない。", "Những thứ thuộc diện hàng cấm nhập khẩu thì không được mang vào trong nước."]]}, {"k": "拡充", "r": "かくじゅう", "h": "Khoách Sung", "m": "Mở rộng, tăng cường (tổ chức, cơ sở)", "ex": [["政府は軍から武器の拡充を依頼された。", "Chính phủ được quân đội yêu cầu mở rộng kho vũ khí."]]}, {"k": "過疎", "r": "かそ", "h": "Quá Sơ", "m": "Suy giảm dân số (vùng thưa dân)", "ex": [["地方の過疎化が進んでいる。", "Tình trạng suy giảm dân số ở địa phương đang tiếp diễn."]]}, {"k": "議案", "r": "ぎあん", "h": "Nghị Án", "m": "Đề án, dự thảo (đưa ra bàn)", "ex": [["市議会では議案が提出されたが、議決には至らなかった。", "Đề án đã được trình trong cuộc họp hội đồng thành phố nhưng chưa đi đến nghị quyết."]]}, {"k": "基準", "r": "きじゅん", "h": "Cơ Chuẩn", "m": "Tiêu chuẩn, chuẩn mực", "ex": [["評価基準に従って学生を厳しく評価した。", "Nghiêm khắc đánh giá học sinh theo tiêu chuẩn đánh giá."]]}, {"k": "義務", "r": "ぎむ", "h": "Nghĩa Vụ", "m": "Nghĩa vụ", "ex": [["税金を払うことは国民の義務だ。", "Đóng thuế là nghĩa vụ của người dân."]]}, {"k": "競技", "r": "きょうぎ", "h": "Cạnh Kỹ", "m": "Thi đấu (thể thao)", "ex": [["オリンピックに向けて新しい競技場が建設されるそうだ。", "Nghe nói sân thi đấu mới được xây dựng để chuẩn bị cho Olympic."]]}, {"k": "拒絶", "r": "きょぜつ", "h": "Cự Tuyệt", "m": "Từ chối, cự tuyệt", "ex": [["軍は政府からの要求を拒絶した。", "Quân đội từ chối yêu cầu từ chính phủ."]]}, {"k": "禁止", "r": "きんし", "h": "Cấm Chỉ", "m": "Cấm, nghiêm cấm", "ex": [["飲酒運転は法律で禁止されている。", "Pháp luật nghiêm cấm việc uống rượu lái xe."]]}, {"k": "傾向", "r": "けいこう", "h": "Khuynh Hướng", "m": "Khuynh hướng, xu hướng", "ex": [["最近の若者は言葉を略す傾向がある。", "Giới trẻ ngày nay có xu hướng nói tắt, rút gọn từ."]]}, {"k": "見当", "r": "けんとう", "h": "Kiến Đương", "m": "Ước chừng, dự đoán", "ex": [["今後どうなるか全く見当がつかない。", "Hoàn toàn không thể đoán được tương lai sẽ ra sao."]]}, {"k": "抗議", "r": "こうぎ", "h": "Kháng Nghị", "m": "Kháng nghị, phản đối", "ex": [["ごみ処理場の建設計画に市民団体が抗議を始めた。", "Tập thể người dân thành phố bắt đầu phản đối kế hoạch xây trạm xử lý rác."]]}, {"k": "国籍", "r": "こくせき", "h": "Quốc Tịch", "m": "Quốc tịch", "ex": [["国籍を変えるのは容易ではない。", "Thay đổi quốc tịch không phải là chuyện dễ dàng."]]}, {"k": "裁判", "r": "さいばん", "h": "Tài Phán", "m": "Xét xử, phiên tòa", "ex": [["この問題は裁判によって解決することになった。", "Vấn đề này được quyết định giải quyết bằng xét xử."]]}, {"k": "支持", "r": "しじ", "h": "Chi Trì", "m": "Ủng hộ", "ex": [["今の大統領を支持しています。", "Tôi ủng hộ tổng thống hiện tại."]]}, {"k": "主義", "r": "しゅぎ", "h": "Chủ Nghĩa", "m": "Chủ nghĩa, nguyên tắc sống", "ex": [["私の主義に反するので、これを認めるわけにはいかない。", "Vì đi ngược lại nguyên tắc của tôi nên tôi không thể chấp nhận."]]}]}};
const el=id=>document.getElementById(id);const card=el('card');
let lessonKey=Object.keys(DATA)[0],order=[],idx=0;
function cards(){return DATA[lessonKey].cards;}
function buildMenu(){const s=el('lesson');s.innerHTML="";Object.keys(DATA).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=DATA[k].name;s.appendChild(o);});s.value=lessonKey;}
function loadLesson(k){lessonKey=k;order=cards().map((_,i)=>i);idx=0;el('lessonName').textContent=DATA[k].name;render();}
function render(){const c=cards()[order[idx]];card.classList.remove('flip');
  el('fWord').textContent=c.k;el('cornerNo').textContent=idx+1;el('bWord').textContent=c.k;el('bKana').textContent=c.r;
  const s=el('bHan');if(c.h&&c.h!=="—"){s.textContent=c.h;s.style.display="";}else{s.style.display="none";}
  el('bMean').textContent=c.m;const ex=el('bEx');ex.innerHTML="";
  c.ex.forEach(p=>{const w=document.createElement('div');w.className='ex';const j=document.createElement('div');j.className='j jp';j.textContent=p[0];const v=document.createElement('div');v.className='v';v.textContent=p[1];w.appendChild(j);w.appendChild(v);ex.appendChild(w);});
  el('cur').textContent=idx+1;el('total').textContent=order.length;el('bar').style.width=((idx+1)/order.length*100)+"%";
  el('prev').disabled=idx===0;el('next').disabled=idx===order.length-1;el('flip').textContent="Lật thẻ";}
function flip(){card.classList.toggle('flip');el('flip').textContent=card.classList.contains('flip')?"Xem kanji":"Lật thẻ";}
function go(s){const n=idx+s;if(n<0||n>=order.length)return;idx=n;render();}
function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}idx=0;render();}
card.addEventListener('click',flip);card.addEventListener('keydown',e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}});
el('flip').addEventListener('click',e=>{e.stopPropagation();flip();});el('prev').addEventListener('click',()=>go(-1));el('next').addEventListener('click',()=>go(1));
el('shuffle').addEventListener('click',shuffle);el('reset').addEventListener('click',()=>loadLesson(lessonKey));el('lesson').addEventListener('change',e=>loadLesson(e.target.value));
document.addEventListener('keydown',e=>{if(e.key==="ArrowLeft")go(-1);else if(e.key==="ArrowRight")go(1);});
buildMenu();loadLesson(lessonKey);
</script>
</body></html>
